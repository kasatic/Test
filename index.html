<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя первая страница</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      margin: 40px;
      line-height: 1.6;
    }
    h1 {
      color: #2c5aa0;
      border-bottom: 2px solid #2c5aa0;
      padding-bottom: 8px;
    }
    p {
      max-width: 600px;
    }
    .highlight {
      background-color: #fff3cd;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Привет, мир!</h1>
  <p>Это моя первая веб-страница. Она создана с помощью простого HTML файла и немного оформлена стилями CSS.</p>
  <p>Стили задают цвет фона, шрифт и отступы, чтобы текст было <span class="highlight">приятно читать</span>.</p>
</body>
</html>
